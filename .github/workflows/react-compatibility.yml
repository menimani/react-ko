name: React compatibility

# Draft pull requests are filtered by the job guards rather than by the types below,
# because `ready_for_review` must reach the workflow to start the run that promotion
# deserves. The default set omits it, so a loop that opens its pull request as a draft
# and later promotes it produced a check that never started.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: React ${{ matrix.react }}
    runs-on: ubuntu-latest
    # A draft pull request is not headed for merge yet, so it is not what CI is for.
    # Absent on a push, the expression is null and the job runs.
    if: github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        react:
          - "18"
          - "19"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Select React ${{ matrix.react }} compatibility peers
        run: >-
          npm pkg set --workspace=src/react-ko
          "devDependencies.react=${{ matrix.react }}"
          "devDependencies.react-dom=${{ matrix.react }}"
          "devDependencies.@types/react=${{ matrix.react }}"
          "devDependencies.@types/react-dom=${{ matrix.react }}"
          "devDependencies.knockout=3.5.1"
      - run: npm install --package-lock=false
      - name: Verify selected peers
        run: >-
          npm ls --workspace=src/react-ko --depth=0
          react react-dom @types/react @types/react-dom knockout
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser smoke
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-audit --no-fund
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
