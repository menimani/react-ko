name: React compatibility

# Draft pull requests are filtered by the job guards rather than by the types below,
# because `ready_for_review` must reach the workflow to start the run that promotion
# deserves. The default set omits it, so a loop that opens its pull request as a draft
# and later promotes it produced a check that never started.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: React ${{ matrix.react }} / types ${{ matrix.types }}
    runs-on: ubuntu-latest
    # A draft pull request is not headed for merge yet, so it is not what CI is for.
    # Absent on a push, the expression is null and the job runs.
    if: github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - react: "18"
            types: "18"
          - react: "19"
            types: "19"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Select React ${{ matrix.react }} compatibility peers
        run: >-
          npm pkg set --workspace=src/react-ko
          "devDependencies.react=${{ matrix.react }}"
          "devDependencies.react-dom=${{ matrix.react }}"
          "devDependencies.@types/react=${{ matrix.types }}"
          "devDependencies.@types/react-dom=${{ matrix.types }}"
          "devDependencies.knockout=3.5.1"
      - run: npm install --package-lock=false
      - name: Verify selected peers
        working-directory: src/react-ko
        env:
          EXPECTED_REACT_MAJOR: ${{ matrix.react }}
          EXPECTED_TYPES_MAJOR: ${{ matrix.types }}
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module'

          const require = createRequire(import.meta.url)
          const expected = {
            react: process.env.EXPECTED_REACT_MAJOR,
            'react-dom': process.env.EXPECTED_REACT_MAJOR,
            '@types/react': process.env.EXPECTED_TYPES_MAJOR,
            '@types/react-dom': process.env.EXPECTED_TYPES_MAJOR,
          }

          for (const [name, expectedMajor] of Object.entries(expected)) {
            const version = require(`${name}/package.json`).version
            const actualMajor = version.split('.')[0]
            if (actualMajor !== expectedMajor) {
              throw new Error(`${name} resolved to ${version}; expected major ${expectedMajor}`)
            }
            console.log(`${name}@${version}`)
          }
          NODE
          npm ls --depth=0 knockout
      - run: npm test
      - run: npm run build

  english:
    name: English only
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v4
      # The check runs as TypeScript with no build step, which needs the native type
      # stripping of Node 23.6 or later. The other jobs pin 22 to match the package's
      # own support floor, so this one carries its own version rather than moving theirs.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Anything this repository produces that is not written in English. No install:
      # the check reads the tree and depends on nothing.
      - run: node checks/english-only.ts

  e2e:
    name: Browser smoke
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-audit --no-fund
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
